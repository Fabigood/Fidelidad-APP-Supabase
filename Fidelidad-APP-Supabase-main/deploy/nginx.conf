# ============================================================================
# nginx - Fidelidad APP
#
# Instalación:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/fidelidad
#   sudo ln -s /etc/nginx/sites-available/fidelidad /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificado TLS (añade automáticamente el bloque 443 y la redirección):
#   sudo certbot --nginx -d tudominio.com -d www.tudominio.com
# ============================================================================

# Limitador en el borde: complementa al de la aplicación. Aquí la IP no se
# puede falsificar, así que es la defensa fiable contra la fuerza bruta.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com;

    # certbot reemplaza este bloque por la redirección a HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tudominio.com www.tudominio.com;

    # certbot rellena estas rutas.
    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # No anunciar la versión de nginx.
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 200k;   # la API rechaza cuerpos mayores a 100 kb

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ─── Frontend (SPA) ──────────────────────────────────────────────────────
    root /var/www/fidelidad;
    index index.html;

    # Sin try_files, recargar /admin/clientes devuelve 404: el enrutado es del
    # lado del cliente y vercel.json no se aplica fuera de Vercel.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ─── Backend ─────────────────────────────────────────────────────────────
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;

        # IMPORTANTE: $proxy_add_x_forwarded_for AÑADE la IP real del cliente al
        # final de la cabecera. Con TRUST_PROXY=1 la aplicación toma ese último
        # valor, que el cliente no puede falsificar.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # No exponer archivos ocultos.
    location ~ /\. {
        deny all;
    }
}
